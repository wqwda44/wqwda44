@keyframes l3c{0.000%{opacity:0}53.094%{opacity:0}53.156%{opacity:1}92.500%{opacity:1}94.375%{opacity:0}100.000%{opacity:0}}
@keyframes cv3{0.000%{transform:translateX(0)}53.094%{transform:translateX(0)}56.344%{transform:translateX(78px)}100.000%{transform:translateX(78px)}}
